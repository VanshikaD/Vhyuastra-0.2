<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4CK3R Security Terminal</title>
    <link href="./dist/output.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --terminal-bg: #0a0a0a;
            --terminal-text: #00ff00;
            --terminal-border: #00ff00;
            --hacker-accent: #ff0080;
            --warning: #ff3333;
            --success: #00ff66;
            --info: #0099ff;
        }
        
        body {
            background: linear-gradient(45deg, #000000, #0a0a0a, #001a00);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--terminal-text);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glitch-text {
            text-shadow: 2px 2px 0 var(--hacker-accent), -2px -2px 0 #00ffff;
            animation: glitch 1s infinite;
        }
        
        @keyframes glitch {
            0% { text-shadow: 2px 2px 0 var(--hacker-accent), -2px -2px 0 #00ffff; }
            50% { text-shadow: -2px -2px 0 var(--hacker-accent), 2px 2px 0 #00ffff; }
            100% { text-shadow: 2px 2px 0 var(--hacker-accent), -2px -2px 0 #00ffff; }
        }
        
        .terminal-window {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--terminal-border);
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .terminal-header {
            background: linear-gradient(90deg, #004400, #007700);
            padding: 10px;
            border-bottom: 1px solid var(--terminal-border);
        }
        
        .terminal-body {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 20, 0, 0.3);
        }
        
        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--terminal-text);
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--hacker-accent), transparent);
            animation: scan 2s linear infinite;
        }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        .hacker-button {
            background: linear-gradient(45deg, #004400, #007700);
            border: 1px solid var(--terminal-border);
            color: var(--terminal-text);
            padding: 12px 24px;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .hacker-button:hover {
            background: linear-gradient(45deg, #007700, #00aa00);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            transform: translateY(-2px);
        }
        
        .hacker-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .hacker-button:hover:before {
            left: 100%;
        }
        
        .security-status {
            border: 2px solid;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            text-shadow: 0 0 10px currentColor;
        }
        
        .status-secure {
            border-color: var(--success);
            color: var(--success);
            background: rgba(0, 255, 102, 0.1);
        }
        
        .status-warning {
            border-color: var(--warning);
            color: var(--warning);
            background: rgba(255, 51, 51, 0.1);
        }
        
        .status-critical {
            border-color: var(--hacker-accent);
            color: var(--hacker-accent);
            background: rgba(255, 0, 128, 0.1);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 128, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 128, 0.6); }
        }
        
        .tool-output {
            font-family: 'Share Tech Mono', monospace;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        
        .port-open { color: var(--success); }
        .port-filtered { color: var(--warning); }
        .port-closed { color: var(--info); }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .notification.success { background: var(--success); }
        .notification.warning { background: var(--warning); }
        .notification.critical { background: var(--hacker-accent); }
        
        .tab-btn {
            background: #004400;
            border: 1px solid var(--terminal-border);
            color: var(--terminal-text);
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: #007700;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        .tab-btn:hover {
            background: #00aa00;
        }
        
        .tab-content {
            display: block;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
